  <line x1="256" y1="392" x2="256" y2="432" stroke="#FFDD57" stroke-width="10" stroke-linecap="round"/>
  <line x1="80" y1="256" x2="120" y2="256" stroke="#FFDD57" stroke-width="10" stroke-linecap="round"/>
